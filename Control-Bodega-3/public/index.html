<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Control 3 - Dinámico</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: grid; grid-template-columns: 1fr 320px; height: 100vh; background: #f0f2f5; }
        
        /* Centro */
        .main { padding: 30px; display: flex; flex-direction: column; gap: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* Formulario */
        input, select, button { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; }
        button { background: #2ecc71; color: white; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: #27ae60; }

        /* Panel Derecho Fijo */
        .fixed-panel { background: white; border-left: 2px solid #ddd; overflow-y: auto; padding: 15px; }
        .panel-header { background: #2c3e50; color: white; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 15px; }
        .barcode-item { background: white; border: 1px solid #eee; padding: 10px; margin-bottom: 10px; text-align: center; border-radius: 8px; }
        .barcode-item svg { width: 100%; height: auto; }
    </style>
</head>
<body onload="cargarUsuarios()">

    <div class="main">
        <div class="card">
            <h1>📥 Registro de Movimientos</h1>
            <p>Selecciona el usuario del panel derecho y completa los datos:</p>
            
            <label>Tipo de Movimiento:</label>
            <select id="tipo">
                <option value="ENTRADA">ENTRADA</option>
                <option value="SALIDA">SALIDA</option>
            </select>

            <input type="text" id="usuario_input" placeholder="Nombre del Usuario (clic en código)">
            <input type="text" id="sku" placeholder="Escanea o escribe SKU">
            
            <button onclick="registrar()">GUARDAR REGISTRO</button>
        </div>

        <div class="card" id="historial">
            <h3>Último registro realizado hoy:</h3>
            <div id="status">Esperando datos...</div>
        </div>
    </div>

    <div class="fixed-panel">
        <div class="panel-header">USUARIOS (FIJO)</div>
        <div id="contenedor-barcodes"></div>
    </div>

    <script>
        // Cargar nombres desde la Base de Datos
        async function cargarUsuarios() {
            try {
                const response = await fetch('/api/usuarios');
                const nombres = await response.json();
                const contenedor = document.getElementById('contenedor-barcodes');
                
                nombres.forEach((nombre, i) => {
                    const div = document.createElement('div');
                    div.className = 'barcode-item';
                    div.style.cursor = "pointer";
                    div.onclick = () => document.getElementById('usuario_input').value = nombre;
                    
                    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                    svg.id = "code" + i;
                    div.appendChild(svg);
                    contenedor.appendChild(div);

                    JsBarcode("#" + svg.id, nombre, { width: 1.5, height: 40, fontSize: 12 });
                });
            } catch (e) { console.error("Error cargando usuarios"); }
        }

        // Guardar en MongoDB Atlas
        async function registrar() {
            const data = {
                usuario: document.getElementById('usuario_input').value,
                sku: document.getElementById('sku').value,
                tipo: document.getElementById('tipo').value
            };

            if(!data.usuario || !data.sku) return alert("Completa todos los campos");

            const res = await fetch('/api/registrar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            if(res.ok) {
                document.getElementById('status').innerText = `✅ Guardado: ${data.tipo} de ${data.sku} por ${data.usuario}`;
                document.getElementById('sku').value = "";
            }
        }
    </script>
</body>
</html>
